<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PriceLoom — Compare prices before you buy</title>

<style>
:root {
  --bg:#f6f7fb;
  --card:#fff;
  --border:#e6e8ef;
  --text:#14161c;
  --muted:#6b7180;
  --accent:#4f46e5;
  --green:#16a34a;
  --green-bg:#ecfdf3;
  --amazon:#ff9900;
  --flipkart:#2874f0;
  --radius:16px;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,
input {
  font:inherit;
}

a {
  text-decoration:none;
  color:inherit;
}

.topbar {
  padding:16px 20px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10;
}

.brand {
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  font-size:1.25rem;
  cursor:pointer;
}

.dot {
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--accent);
}

.banner {
  background:#1e1b2e;
  color:#ddd6fe;
  text-align:center;
  padding:9px 15px;
  font-size:.78rem;
}

.container {
  max-width:900px;
  margin:auto;
  padding:25px 18px 70px;
}

.hero {
  text-align:center;
  padding:20px 5px;
}

.hero h1 {
  font-size:clamp(1.7rem,5vw,2.3rem);
  margin:0 0 8px;
}

.hero p {
  color:var(--muted);
  margin:0 0 22px;
}

.search-box {
  display:flex;
  gap:8px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.search-box input {
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  padding:13px 10px;
  background:transparent;
}

.search-box button {
  border:0;
  background:var(--accent);
  color:white;
  padding:0 22px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.section-heading {
  font-size:.85rem;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.04em;
  margin:28px 2px 12px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  transition:.15s;
}

.card:hover {
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.06);
}

.emoji {
  font-size:2.1rem;
  display:block;
  margin-bottom:8px;
}

.name {
  font-weight:750;
  line-height:1.35;
  margin-bottom:8px;
}

.category {
  color:var(--muted);
  font-size:.75rem;
  margin-bottom:12px;
}

.price {
  font-size:1.15rem;
  font-weight:800;
  color:var(--accent);
}

.store {
  color:var(--muted);
  font-size:.72rem;
}

.buttons {
  display:flex;
  gap:8px;
  margin-top:14px;
}

.store-button {
  flex:1;
  text-align:center;
  padding:9px 5px;
  border-radius:9px;
  font-size:.75rem;
  font-weight:800;
}

.amazon {
  background:#fff3df;
  color:#a65d00;
}

.flipkart {
  background:#eaf2ff;
  color:#1458bd;
}

.search-result {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  margin-bottom:12px;
}

.search-result h3 {
  margin:0 0 8px;
}

.search-result p {
  color:var(--muted);
  font-size:.85rem;
  margin:0 0 15px;
}

.big-buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.big-button {
  padding:14px;
  border-radius:11px;
  text-align:center;
  font-weight:800;
}

.empty {
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}

.notice {
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  color:var(--muted);
  font-size:.82rem;
  margin-bottom:15px;
}

.footer {
  text-align:center;
  color:var(--muted);
  font-size:.78rem;
  padding:30px 15px 45px;
}

@media(max-width:500px) {
  .grid {
    grid-template-columns:1fr 1fr;
  }

  .search-box button {
    padding:0 15px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand" onclick="goHome()">
    <span class="dot"></span>
    PriceLoom
  </div>
</header>

<div class="banner">
  Compare prices before you buy
</div>

<main class="container">

  <section class="hero">
    <h1>Is this price actually good?</h1>

    <p>
      Search products and compare Amazon & Flipkart.
    </p>

    <div class="search-box">
      <input
        id="searchInput"
        type="search"
        placeholder="Search any product..."
        autocomplete="off"
      >

      <button onclick="searchProducts()">
        Search
      </button>
    </div>
  </section>

  <div id="notice"></div>

  <div class="section-heading" id="heading">
    All Products
  </div>

  <div class="grid" id="productGrid"></div>

</main>

<footer class="footer">
  PriceLoom — free price comparison on GitHub Pages
</footer>

<script>

let PRODUCTS = [];

/* -----------------------------
   HELPERS
----------------------------- */

function money(value) {

  if (value === null || value === undefined || value === "") {
    return "Price unavailable";
  }

  return "₹" + Number(value).toLocaleString("en-IN");
}


function amazonSearch(name) {

  return "https://www.amazon.in/s?k=" +
    encodeURIComponent(name);
}


function flipkartSearch(name) {

  return "https://www.flipkart.com/search?q=" +
    encodeURIComponent(name);
}


function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* -----------------------------
   LOAD PRODUCTS
----------------------------- */

async function loadProducts() {

  try {

    const response = await fetch("./products.json", {
      cache:"no-store"
    });

    if (!response.ok) {
      throw new Error("products.json failed");
    }

    PRODUCTS = await response.json();

    renderProducts(PRODUCTS);

  } catch(error) {

    console.error(error);

    document.getElementById("productGrid").innerHTML = `
      <div class="empty">
        Product catalog could not be loaded.
      </div>
    `;
  }
}


/* -----------------------------
   SEARCH
----------------------------- */

function searchProducts() {

  const input =
    document.getElementById("searchInput");

  const query =
    input.value.trim().toLowerCase();

  if (!query) {

    renderProducts(PRODUCTS);

    document.getElementById("heading").textContent =
      "All Products";

    document.getElementById("notice").innerHTML = "";

    return;
  }

  const words = query
    .split(/\s+/)
    .filter(Boolean);

  const results = PRODUCTS.filter(product => {

    const searchable = [

      product.name,
      product.category,
      product.brand,
      ...(product.tags || [])

    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    return words.every(word =>
      searchable.includes(word)
    );
  });


  document.getElementById("heading").textContent =
    "Search results";


  /*
    IMPORTANT:
    Even when our local catalog does not contain
    the product, we still provide marketplace search.
  */

  document.getElementById("notice").innerHTML = `

    <div class="notice">

      <strong>Searching for:</strong>
      ${escapeHTML(input.value)}

      <br><br>

      PriceLoom can search Amazon and Flipkart
      even when this product is not yet in our
      local catalog.

    </div>

    <div class="search-result">

      <h3>
        ${escapeHTML(input.value)}
      </h3>

      <p>
        Search this product directly on both stores.
      </p>

      <div class="big-buttons">

        <a
          class="big-button amazon"
          href="${amazonSearch(input.value)}"
          target="_blank"
          rel="noopener"
        >
          🛒 Amazon
        </a>

        <a
          class="big-button flipkart"
          href="${flipkartSearch(input.value)}"
          target="_blank"
          rel="noopener"
        >
          🛍️ Flipkart
        </a>

      </div>

    </div>
  `;


  if (results.length) {

    renderProducts(results);

  } else {

    document.getElementById("productGrid").innerHTML = "";

  }
}


/* -----------------------------
   RENDER LOCAL PRODUCTS
----------------------------- */

function renderProducts(list) {

  const grid =
    document.getElementById("productGrid");

  if (!list.length) {

    grid.innerHTML = `
      <div class="empty"
           style="grid-column:1/-1">

        No catalog products yet.

      </div>
    `;

    return;
  }


  grid.innerHTML = list.map(product => {

    const amazon =
      Number(product.current_amazon);

    const flipkart =
      Number(product.current_flipkart);

    const validAmazon =
      Number.isFinite(amazon) && amazon > 0;

    const validFlipkart =
      Number.isFinite(flipkart) && flipkart > 0;


    let bestPrice = null;
    let bestStore = "";


    if (validAmazon && validFlipkart) {

      if (amazon <= flipkart) {

        bestPrice = amazon;
        bestStore = "Amazon";

      } else {

        bestPrice = flipkart;
        bestStore = "Flipkart";

      }

    } else if (validAmazon) {

      bestPrice = amazon;
      bestStore = "Amazon";

    } else if (validFlipkart) {

      bestPrice = flipkart;
      bestStore = "Flipkart";
    }


    return `

      <article class="card">

        <span class="emoji">
          ${escapeHTML(product.emoji || "📦")}
        </span>

        <div class="name">
          ${escapeHTML(product.name)}
        </div>

        <div class="category">
          ${escapeHTML(product.category || "Product")}
        </div>

        ${
          bestPrice !== null

          ? `

            <div class="price">
              ${money(bestPrice)}
            </div>

            <div class="store">
              Best stored price: ${bestStore}
            </div>

          `

          : `

            <div class="price">
              Price unavailable
            </div>

          `
        }


        <div class="buttons">

          <a
            class="store-button amazon"
            href="${amazonSearch(product.name)}"
            target="_blank"
            rel="noopener"
          >
            Amazon
          </a>

          <a
            class="store-button flipkart"
            href="${flipkartSearch(product.name)}"
            target="_blank"
            rel="noopener"
          >
            Flipkart
          </a>

        </div>

      </article>
    `;

  }).join("");
}


/* -----------------------------
   HOME
----------------------------- */

function goHome() {

  document.getElementById("searchInput").value = "";

  document.getElementById("notice").innerHTML = "";

  document.getElementById("heading").textContent =
    "All Products";

  renderProducts(PRODUCTS);

}


/* -----------------------------
   ENTER KEY
----------------------------- */

document
  .getElementById("searchInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      searchProducts();

    }

  });


/* -----------------------------
   START
----------------------------- */

loadProducts();

</script>

</body>
</html>
